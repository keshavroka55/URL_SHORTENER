{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-5">
        <div class="glass-card border-primary" style="border-width: 2px !important;">
            <h2 class="fw-bold mb-4 text-center">Join LinkSwift</h2>
            <p class="text-muted text-center mb-4">Create your account to start shortening links</p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a strong password"
                        required>
                </div>

                <button class="btn btn-primary w-100 py-2 mb-3">Create Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Already have an account?</span>
                <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-bold ms-1">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
