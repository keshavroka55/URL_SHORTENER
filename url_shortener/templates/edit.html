{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6">
        <div class="glass-card">
            <h2 class="fw-bold mb-4">Edit URL</h2>
            <p class="text-muted mb-4">Update the destination for your short key: <strong>{{ url.short_key }}</strong>
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Original URL</label>
                    <input type="url" name="original_url" value="{{ url.original_url }}" class="form-control" required>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary px-4">Update Destination</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
