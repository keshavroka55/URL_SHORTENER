{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSwift | Professional URL Shortener</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">LinkSwift</a>
            <div class="ms-auto d-flex align-items-center">
                {% if user.is_authenticated %}
                <span class="text-muted me-3 d-none d-md-inline">Welcome, <strong>{{ user.username }}</strong></span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger px-3">Logout</a>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-primary px-4 me-2">Login</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-outline-light px-4">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5 pb-5">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
