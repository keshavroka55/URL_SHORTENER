{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6">
        <div class="glass-card">
            <h2 class="fw-bold mb-4">Shorten a Link</h2>
            <p class="text-muted mb-4">Paste your long URL and get a snappy short one instantly.</p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Original URL</label>
                    <input type="url" name="original_url" class="form-control"
                        placeholder="https://example.com/very-long-link" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Custom Key (Optional)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted">{{ request.get_host
                            }}/</span>
                        <input type="text" name="custom_key" class="form-control border-start-0"
                            placeholder="my-custom-link">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase">Expiration Date (Optional)</label>
                    <input type="datetime-local" name="expires_at" class="form-control">
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary px-4">Create Link</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
